<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jenna’s Recipe Website</title>
   <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
   
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="eggs.css" />
  </head>

  <body>

    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
      <div class="container-fluid">
        <p class="navbar-brand">
          <i class="bi bi-cookie">&nbsp;&nbsp;</i>Jenna’s Recipe Website
        </p>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
              Jenna’s Recipe Website
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">
                  <i class="bi bi-house">&nbsp;&nbsp;</i>Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="About.html"
                  ><i class="bi bi-person">&nbsp;&nbsp;</i>About</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="Recipe.html"
                  ><i class="bi bi-book-half">&nbsp;&nbsp;</i>Recipe</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="Store.html"
                  ><i class="bi bi-shop">&nbsp;&nbsp;</i>Store</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <header class="bg-dark text-white text-center py-5">
      <h1 style="font-family: 'Playfair Display', serif;">Jenna's Recipes</h1>
      <p style="font-family: 'Poppins', sans-serif;">
        Find new recipes with the ingredients you have at hand!
      </p>
    </header>


    <section class="container my-5">
      <div class="row">
        <div class="col-md-12 text-center">
          <h2 style="font-family: 'Playfair Display', serif;">
            Generate Recipes on Demand
          </h2>
          <p style="font-family: 'Poppins', sans-serif;">
            Input your ingredients below and let us find a dish for you!
          </p>
        </div>
      </div>
    </section>

    <!-- Input Form -->
    <div class="container my-5">
      <h1 class="text-center" style="font-family: 'Playfair Display', serif;">
        Search for Recipes by Ingredients
      </h1>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="mb-3">
            <input
              type="text"
              id="ingredient1"
              placeholder="Ingredient 1"
              class="form-control mb-2"
              style="font-family: 'Poppins', sans-serif; font-size: 1rem;"
            />
            <input
              type="text"
              id="ingredient2"
              placeholder="Ingredient 2"
              class="form-control mb-2"
              style="font-family: 'Poppins', sans-serif; font-size: 1rem;"
            />
            <input
              type="text"
              id="ingredient3"
              placeholder="Ingredient 3"
              class="form-control mb-3"
              style="font-family: 'Poppins', sans-serif; font-size: 1rem;"
            />
            <button
              id="searchButton"
              class="btn btn-primary w-100"
              style="font-family: 'Poppins', sans-serif; font-weight: 600;"
            >
              Generate Recipe
            </button>
          </div>

          <div id="results" class="mt-4"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="recipe.js"></script>
  </body>
</html>
